<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VibeLang — browser demo</title>
    <base href="/VibeLang/" />
    <link rel="stylesheet" href="lib/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/demo.css" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon.png" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-512.png" />
</head>
<body class="d-flex flex-column min-vh-100">
    <div id="app">
        <div class="boot">
            <div class="boot-inner">
                <div class="spinner-border text-primary mb-3" role="status"></div>
                <div class="fw-semibold">VibeLang</div>
                <div class="text-muted small">Starting the in-browser database…</div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Something went wrong in the demo.
        <a href="" class="reload">Reload</a>
    </div>

    <script src="js/images.js"></script>
    <script src="js/lesson-parser.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
